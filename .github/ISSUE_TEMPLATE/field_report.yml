name: Field report
description: Something observed in real TwinCAT - a file that did or did not open or record, an export layout, a trigger mode.
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: |
        Field results are the most useful contribution to this skill: they are what moves
        items from "not verified" to "verified" in the README.

        **This repository is public. Redact before you paste.** Replace NetIDs with
        `1.2.3.4.1.1`, and customer, site and machine names with stand-ins. Keep the numbers.
        The full checklist is in `examples/README.md`.
  - type: textarea
    id: tried
    attributes:
      label: What you tried
      description: Commands run, the file involved (generated by `newscope`, a template as shipped, or your own), and what you did in Scope View.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened
      description: Did it open, record, export? Error text verbatim.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence (redacted)
      description: "`checkscope` or `manifest --dump-header` output, or the relevant XML fragment."
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "TwinCAT 3.1.4026, Scope View 3.4, skill commit abc1234"
  - type: checkboxes
    id: redacted
    attributes:
      label: Redaction
      options:
        - label: I have removed NetIDs, IPs, hostnames and customer, site and machine names from everything above.
          required: true
